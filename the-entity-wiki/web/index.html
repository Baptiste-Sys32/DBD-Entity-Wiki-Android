      const getTierStyle = (tierBucket) => {
        const bucket = String(tierBucket || '').toLowerCase();

        if (bucket === 'good') return { color: '#f97316', borderColor: 'rgba(249,115,22,0.35)' };
        if (bucket === 'decent') return { color: '#22c55e', borderColor: 'rgba(34,197,94,0.35)' };
        if (bucket === 'almost-no-effect') return { color: '#64748b', borderColor: 'rgba(100,116,139,0.35)' };
        if (bucket === 'detrimental') return { color: '#ef4444', borderColor: 'rgba(239,68,68,0.35)' };
        return { color: '#94a3b8', borderColor: 'rgba(148,163,184,0.35)' };

        const merged = [...defaults, ...sourceLinks];
        const seen = new Set();
        return merged.filter((entry) => {

          seen.add(url);
          return true;

                          </span>
                          <span style={{ minWidth: 0, flex: 1 }}>

                              <span style={{ fontSize: 11, color: 'var(--muted)', fontWeight: 700 }}>#{addon.rank}</span>

          if (debounceTimer) clearTimeout(debounceTimer);
          debounceTimer = setTimeout(tryAttach, 150);
        });
        if (mainRef.current) observer.observe(mainRef.current, { childList: true, subtree: false });

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error('[ErrorBoundary]', error, info);
        window.__hideLaunchOverlay?.(true);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 40, textAlign: 'center', color: '#e5e7eb', background: '#090b11', minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
              <h2 style={{ fontSize: 22, fontWeight: 700 }}>Something went wrong</h2>
              <p style={{ color: '#71717a', fontSize: 14 }}>{this.state.error?.message || 'An unexpected error occurred.'}</p>
              <button
                onClick={() => this.setState({ hasError: false, error: null })}
                style={{ marginTop: 8, padding: '10px 24px', borderRadius: 12, background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', color: '#e5e7eb', cursor: 'pointer', fontSize: 14 }}
              >
                Try Again
              </button>
              <button
                onClick={() => window.location.reload()}
                style={{ padding: '10px 24px', borderRadius: 12, background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', color: '#e5e7eb', cursor: 'pointer', fontSize: 14 }}
              >
                Reload App
              </button>
              <button
                onClick={() => {
                  try {
                    Object.keys(localStorage)
                      .filter((key) => key.startsWith('dbd_'))
                      .forEach((key) => localStorage.removeItem(key));
                  } catch (e) { }
                  window.location.reload();
                }}
                style={{ padding: '10px 24px', borderRadius: 12, background: 'rgba(225,29,72,0.15)', border: '1px solid rgba(225,29,72,0.4)', color: '#fda4af', cursor: 'pointer', fontSize: 14 }}
              >
                Clear Saved Data &amp; Reload
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }
    window.addEventListener('error', (event) => {
      console.error('[window.onerror]', event?.message, event?.filename, event?.lineno);
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('[unhandledrejection]', event?.reason);
    });
    if (typeof DATABASE === 'undefined') {
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#e5e7eb;background:#090b11;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:sans-serif"><h2 style="font-size:22px;font-weight:700">Game data failed to load</h2><p style="color:#71717a;font-size:14px">The offline database did not load. Reinstall the app or clear the app cache, then try again.</p></div>';
      window.__hideLaunchOverlay?.(true);
    } else {
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
    }
  </script>
</body>

</html>
